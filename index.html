<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pakistan Congress of Zoology - Abstract & Paper Submission</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f4f8; color: #333; padding: 40px 20px; }
    .container { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
    .header h1 { color: #1b4332; font-size: 24px; margin-bottom: 6px; }
    .header p { color: #52796f; font-size: 14px; font-weight: 600; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #2d6a4f; margin-bottom: 8px; }
    input[type="text"], input[type="email"], select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; background-color: #f8fafc; }
    input:focus, select:focus { border-color: #2d6a4f; outline: none; background-color: #fff; }
    input[type="file"] { width: 100%; padding: 10px; background: #f1f5f9; border: 1px dashed #94a3b8; border-radius: 6px; cursor: pointer; }
    .btn-submit { width: 100%; background: #2d6a4f; color: white; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s ease; }
    .btn-submit:hover { background: #1b4332; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    #statusMessage { margin-top: 20px; padding: 12px; border-radius: 6px; text-align: center; font-weight: 600; display: none; }
    .status-info { background: #e0f2fe; color: #0369a1; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Pakistan Congress of Zoology</h1>
    <p>Abstract & Presentation Upload Portal</p>
  </div>

  <form id="submissionForm">
    <div class="form-group">
      <label for="authorName">Presenter / Author Full Name *</label>
      <input type="text" id="authorName" required placeholder="e.g., Prof. Dr. Ali Khan">
    </div>

    <div class="form-group">
      <label for="email">Email Address *</label>
      <input type="email" id="email" required placeholder="author@university.edu.pk">
    </div>

    <div class="form-group">
      <label for="paperTitle">Paper / Presentation Title *</label>
      <input type="text" id="paperTitle" required placeholder="Enter full title of paper">
    </div>

    <div class="form-group">
      <label for="category">Subject Category *</label>
      <select id="category" required>
        <option value="" disabled selected>Select Congress Category</option>
        <option value="Entomology">Entomology</option>
        <option value="Fisheries_Aquaculture">Fisheries & Aquaculture</option>
        <option value="Wildlife_Ecology">Wildlife & Ecology</option>
        <option value="Cell_Molecular_Biology">Cell & Molecular Biology</option>
        <option value="Parasitology">Parasitology</option>
        <option value="Genetics_Physiology">Genetics & Physiology</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="form-group">
      <label for="fileInput">Upload File (PDF, PPTX, DOCX - Max 50MB) *</label>
      <input type="file" id="fileInput" accept=".pdf,.pptx,.docx,.doc" required>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">Submit Document</button>
  </form>

  <div id="statusMessage"></div>
</div>

<script>
  const SUPABASE_URL = 'https://uqpzqwdcsuqbsyozlchb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxcHpxd2Rjc3VxYnN5b3psY2hiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDkzODIsImV4cCI6MjEwMzQ4NTM4Mn0.CwM87DpC7-6NFOm-QOMtW2zwze0yajLwSGrHWAAN__g';
  
  // Solved crash: Uses window.supabase to avoid variable shadowing
  const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('submissionForm');
  const submitBtn = document.getElementById('submitBtn');
  const statusMessage = document.getElementById('statusMessage');

  function showStatus(msg, type) {
    statusMessage.style.display = 'block';
    statusMessage.className = 'status-' + type;
    statusMessage.innerText = msg;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    showStatus("Uploading file to cloud storage...", "info");

    const file = document.getElementById('fileInput').files[0];
    const authorName = document.getElementById('authorName').value.trim();
    const email = document.getElementById('email').value.trim();
    const paperTitle = document.getElementById('paperTitle').value.trim();
    const category = document.getElementById('category').value;

    const sanitizedFileName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
    const storageFilePath = `${category}/${Date.now()}_${sanitizedFileName}`;

    try {
      // 1. Upload File
      const { data: uploadData, error: uploadErr } = await dbClient.storage
        .from('abstracts-and-papers')
        .upload(storageFilePath, file);

      if (uploadErr) throw uploadErr;

      // 2. Insert metadata row
      const { error: dbErr } = await dbClient
        .from('submissions')
        .insert([{
          author_name: authorName,
          email: email,
          paper_title: paperTitle,
          category: category,
          file_path: storageFilePath
        }]);

      if (dbErr) throw dbErr;

      showStatus("Submission successfully uploaded!", "success");
      form.reset();
    } catch (err) {
      showStatus("Error: " + err.message, "error");
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
